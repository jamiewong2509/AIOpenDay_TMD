<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Business Chat Prototype – Transfer & Time Deposit</title>
<style>
  :root{
    --bg:#ffffff; --ink:#111111; --muted:#6b6b6b; --line:#e2e2e2;
    --accent:#db0011; --user:#f2f2f2;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
    font-family:-apple-system,"Segoe UI",Roboto,"Helvetica Neue","PingFang SC","Microsoft YaHei",Arial,sans-serif}
  body{display:flex;justify-content:center;align-items:center;padding:24px 16px}
  .phone{width:100%;max-width:420px;height:calc(100vh - 48px);max-height:860px;background:var(--bg);
    border:1px solid var(--ink);border-radius:22px;display:flex;flex-direction:column;overflow:hidden}

  /* Header */
  header{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
  .icon-btn{width:34px;height:34px;border:none;background:none;display:grid;place-items:center;cursor:pointer;color:var(--accent);border-radius:50%;flex-shrink:0}
  .icon-btn:hover{background:#fdecee}
  .h-title{flex:1;min-width:0}
  .h-title b{display:block;font-size:15.5px;color:var(--accent);line-height:1.25}
  .h-title span{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
  .dot{width:7px;height:7px;border-radius:50%;background:#1f9d55}

  /* Messages */
  main{flex:1;overflow-y:auto;padding:18px 16px 8px;scroll-behavior:smooth}
  .day{text-align:center;font-size:11px;color:var(--muted);margin:0 0 14px}
  .row{display:flex;gap:8px;margin:0 0 12px;align-items:flex-end;animation:pop .22s ease-out}
  .row.user{justify-content:flex-end}
  .row.user > div{display:flex;flex-direction:column;align-items:flex-end;max-width:78%}
  .avatar{width:28px;height:28px;border-radius:50%;border:1px solid var(--ink);display:grid;place-items:center;flex-shrink:0}
  .bubble{max-width:78%;padding:10px 13px;font-size:14.5px;line-height:1.45;border-radius:16px;word-wrap:break-word;white-space:pre-wrap}
  .user .bubble{max-width:100%}
  .bot .bubble{background:#fff;border:1px solid var(--ink);border-bottom-left-radius:4px}
  .user .bubble{background:var(--user);border:1px solid var(--user);border-bottom-right-radius:4px}
  .user .bubble.tap{background:#fff;border:1.5px solid var(--accent);color:var(--accent);font-weight:600}
  .meta{font-size:10.5px;color:var(--muted);margin-top:4px}
  .user .meta{text-align:right}
  .hl{display:block;margin:8px 0;padding:8px 10px;border-left:3px solid var(--accent);background:#fafafa;border-radius:6px;font-weight:600}
  .card{border:1px solid var(--ink);border-radius:12px;padding:12px;margin-top:2px;font-size:13.5px;background:#fff;white-space:normal}
  .card .t{font-weight:700;margin-bottom:8px}
  .card dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:4px 10px}
  .card dt{color:var(--muted);white-space:nowrap} .card dd{margin:0}
  .bot .bubble:has(.card){width:280px;max-width:calc(100% - 36px)}
  .row.bot > div:has(.card){flex:1;min-width:0}

  /* Action buttons inside bot bubbles */
  .actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;white-space:normal}
  .actions button{font:inherit;font-size:13.5px;font-weight:600;padding:9px 15px;border-radius:999px;
    border:1.5px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer}
  .actions button.ghost{background:#fff;color:var(--accent)}
  .actions button:not(:disabled):hover{filter:brightness(.92)}
  .actions button:disabled{opacity:.35;cursor:default}

  .typing .bubble{display:flex;gap:4px;padding:13px 14px}
  .typing i{width:7px;height:7px;border-radius:50%;background:var(--ink);opacity:.3;animation:blink 1s infinite}
  .typing i:nth-child(2){animation-delay:.15s} .typing i:nth-child(3){animation-delay:.3s}
  @keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:.9}}
  @keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

  /* Composer */
  footer{border-top:1px solid var(--line);padding:10px 12px 14px;display:flex;gap:8px;align-items:center}
  footer input[type=text]{flex:1;min-width:0;border:1px solid var(--ink);border-radius:999px;padding:11px 16px;font-size:14.5px;outline:none;font-family:inherit;color:var(--ink);background:#fff}
  footer input:disabled{background:#fafafa}
  .send{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;cursor:pointer;flex-shrink:0;border:none;background:var(--accent);color:#fff}
  .send:disabled{opacity:.4;cursor:default}
  .note{font-size:10.5px;color:var(--muted);text-align:center;padding:0 0 8px}

  @media (max-width:480px){
    body{padding:12px}
    .phone{height:calc(100vh - 24px)}
  }
</style>
</head>
<body>
<div class="phone">
  <header>
    <button class="icon-btn" aria-label="Back">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12H4"/><path d="M10 6l-6 6 6 6"/></svg>
    </button>
    <div class="h-title">
      <b>Business Express Virtual Assistant</b>
      <span><i class="dot"></i>Online · replies instantly</span>
    </div>
  </header>

  <main id="chat" aria-live="polite"></main>

  <div class="note">Prototype · demo data only</div>
  <footer>
    <input id="msg" type="text" placeholder="Type a message…" autocomplete="off" aria-label="Message">
    <button class="send" id="send" aria-label="Send">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M4 12l16-8-6 16-2.5-6.5z"/></svg>
    </button>
  </footer>
</div>

<script>
/* ---------- Demo data (edit here) ---------- */
const TD_RATE = 0.03;          // 3% p.a.
const TD_TENOR_MONTHS = 2;     // 2-month tenor

/* Demo mode: pressing Send with an empty box sends the next customer line from the script.
   At a step with a button, it taps the main button instead. */
const DEMO_SCRIPT = {
  menu:          "Hi, I'd like to transfer HKD 500,000 to Bank A account 122344555.",
  ask_name:      "The beneficiary name is Smart Travel Limited.",
  offer:         "Oh, that sounds interesting. Can you tell me more about the time deposit?",
  td_explain:    "__BTN__",
  tx_review:     "__BTN__",
  anything_else: "No, that's all"
};

/* ---------- UI helpers ---------- */
const chat = document.getElementById('chat');
const input = document.getElementById('msg');
const sendBtn = document.getElementById('send');
const sleep = ms => new Promise(r => setTimeout(r, ms));
const now = () => new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt = n => 'HKD ' + Number(n).toLocaleString('en-US', {maximumFractionDigits: 2});
const fmtDate = d => d.toLocaleDateString('en-GB', {day:'numeric', month:'long', year:'numeric'});
const scroll = () => { chat.scrollTop = chat.scrollHeight; };
let busy = false;

const BOT_ICON = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 5h16v11H9l-5 4z"/></svg>';

function addRow(who, html, cls = ''){
  const row = document.createElement('div');
  row.className = 'row ' + who;
  row.innerHTML = (who === 'bot' ? `<div class="avatar">${BOT_ICON}</div>` : '') +
    `<div><div class="bubble ${cls}">${html}</div><div class="meta">${now()}${who==='user'?' · Read':''}</div></div>`;
  chat.appendChild(row);
  scroll();
  return row;
}
function setBusy(b){
  busy = b; input.disabled = b; sendBtn.disabled = b;
  chat.querySelectorAll('.actions button:not(.used)').forEach(x => x.disabled = b);
  if(!b) input.focus();
}
/* Once the customer moves on, earlier buttons go stale */
function retireButtons(){
  chat.querySelectorAll('.actions button').forEach(x => { x.disabled = true; x.classList.add('used'); });
}

async function say(html, {plainLen, wait} = {}){
  const t = document.createElement('div');
  t.className = 'row bot typing';
  t.innerHTML = `<div class="avatar">${BOT_ICON}</div><div class="bubble"><i></i><i></i><i></i></div>`;
  chat.appendChild(t); scroll();
  const len = plainLen ?? html.replace(/<[^>]+>/g,'').length;
  await sleep(wait ?? Math.min(450 + len * 11, 1900));
  t.remove(); return addRow('bot', html);
}
async function bot(lines){
  setBusy(true);
  for (const l of lines) await say(l);
  setBusy(false);
}

/* Buttons: [{id, label, ghost}] – rendered inside a bot bubble */
const buttons = list => `<div class="actions">${list.map((b,i) =>
  `<button data-act="${b.id}" class="${b.ghost?'ghost':''}" ${i===0?'data-primary':''}>${esc(b.label)}</button>`).join('')}</div>`;

chat.addEventListener('click', e => {
  const b = e.target.closest('.actions button');
  if (!b || b.disabled || busy) return;
  tapButton(b);
});
function tapButton(b){
  retireButtons();
  addRow('user', esc(b.textContent), 'tap');
  action(b.dataset.act);
}

/* ---------- Language understanding ---------- */
const norm = s => s.toLowerCase().replace(/[’']/g,"'").replace(/[.,!?;:~，。！？、…]+/g,' ').replace(/\s+/g,' ').trim();

const POS_EN = ["yes","yeah","yea","yep","yup","ya","sure","ok","okay","k","correct","right","exactly","absolutely","definitely","of course","sounds good","perfect","great","nice","cool","awesome","please","please do","go ahead","let's do it","lets do it","do it","👍","✅"];
const POS_CN = ["是","是的","对","好","好的","可以","嗯","行","确认"];
const NEG_EN = ["no","nope","nah","not","negative","never","nothing","nothing else","don't","dont","no thanks","that's all","thats all","i'm good","im good","all good","i'm fine","im fine","not interested","👎","❌"];
const NEG_CN = ["不","不是","不用","不用了","算了","没了","没有了","不需要"];

function hasPhrase(t, list){
  return list.some(p => /^[a-z' ]+$/.test(p)
    ? new RegExp(`(^|\\s)${p}(\\s|$)`).test(t)
    : t.includes(p));
}
const isNeg = t => hasPhrase(t, NEG_EN) || hasPhrase(t, NEG_CN);
const isPos = t => !isNeg(t) && (hasPhrase(t, POS_EN) || hasPhrase(t, POS_CN));
const isThanks = t => /(thank|thx|\bty\b|cheers|谢谢|多谢)/.test(t);
const isGreeting = t => /^(hi|hello|hey|hiya|morning|good (morning|afternoon|evening)|你好|您好)( there)?$/.test(t);
const isTransferIntent = t => /(transfer|send money|\bsend\b|\bpay\b|payment|remit|wire|转账|汇款|付款)/.test(t);
const isTDIntent = t => /(time deposit|fixed deposit|\btd\b|定期|deposit|interest|rate)/.test(t);
const wantsMore = t => /(more|tell me|details?|explain|how does|how much|what is|what's|interest|interesting|sounds|curious|time deposit|\btd\b|定期)/.test(t) || isPos(t);
const wantsTransfer = t => /(transfer|go ahead|proceed|continue|carry on|just send|send it|stick with|no thanks|not interested|转账)/.test(t);
const wantsSetup = t => /(set( it| this| that)? up|sign me up|book|open|place|start|i'll take|ill take|let's do|lets do|do it|go for)/.test(t) || (isPos(t) && !/transfer/.test(t));

/* ---------- Transfer slot filling ---------- */
let tx = {amount:null, bank:null, account:null, name:null};

function parseAmount(s){
  const m = s.replace(/(account|acct|a\/c)\s*(no\.?|number|#)?\s*:?\s*[\d-]{5,}/gi,' ')
             .match(/(\d[\d,]*(?:\.\d+)?)\s*(k|m|mn|million|thousand)?\b/i);
  if (!m) return null;
  let n = parseFloat(m[1].replace(/,/g,''));
  const u = (m[2]||'').toLowerCase();
  if (u === 'k' || u === 'thousand') n *= 1e3;
  if (u === 'm' || u === 'mn' || u === 'million') n *= 1e6;
  return n > 0 ? n : null;
}
function absorb(raw, ctx){
  const acc = raw.match(/(?:account|acct|a\/c)\s*(?:no\.?|number|#)?\s*:?\s*([\d-]{5,})/i);
  if (acc) tx.account = acc[1];
  const bank = raw.match(/\bbank\s+(?!account\b)([a-z0-9]{1,12})\b/i) || raw.match(/\b([a-z]{2,12})\s+bank\b/i);
  if (bank) tx.bank = /^bank/i.test(bank[0]) ? 'Bank ' + bank[1].toUpperCase() : bank[0].replace(/\b\w/g, c => c.toUpperCase());
  if (ctx === 'dest' && !tx.account) {
    const bare = raw.match(/\b(\d[\d-]{5,})\b/);
    if (bare) tx.account = bare[1];
  } else if (ctx !== 'dest') {
    const amt = parseAmount(raw);
    if (amt) tx.amount = amt;
  }
}
function extractName(raw){
  return raw.trim()
    .replace(/^(ok(ay)?|sure|yes)[,\s]*/i,'')
    .replace(/^(the\s+)?(beneficiary('s)?|payee('s)?|recipient('s)?)?\s*(name\s*)?(is|:)\s*/i,'')
    .replace(/^(it's|its|it is)\s+/i,'')
    .replace(/[.。!]+$/,'').trim();
}

async function nextSlot(lead = ''){
  const L = lead ? lead + ' ' : '';
  if (!tx.amount) { state = 'ask_amount'; return bot([L + "How much would you like to transfer (in HKD)?"]); }
  if (!tx.bank || !tx.account) { state = 'ask_dest'; return bot([L + "Which bank and account number would you like to send it to?"]); }
  if (!tx.name) {
    state = 'ask_name';
    return bot([`${L}Before we proceed, could you please provide the beneficiary name for account ${esc(tx.account)}?`]);
  }
  return offerTD();
}

/* ---------- Conversation state machine ---------- */
let state = 'menu';
let tdDone = false;
let chatStart = new Date();   // the date the chat was opened – the TD tenor counts from here

async function welcome(){
  chatStart = new Date();
  chat.innerHTML = `<div class="day">Today · ${fmtDate(chatStart)}</div>`;
  state = 'menu';
  await bot([
    "Hi there, welcome to Business Express Virtual Assistant!",
    "I'm here to make your banking day a little easier. How can I help you today?"
  ]);
}

async function askAnythingElse(lead){
  state = 'anything_else';
  await bot([lead ? lead + " Is there anything else I can help you with?" : "Is there anything else I can help you with today? 😊"]);
}

function handleUser(text){
  if (busy) return;
  text = text.trim() || DEMO_SCRIPT[state] || '';
  if (!text) return;
  if (text === '__BTN__') {
    input.value = '';
    const b = [...chat.querySelectorAll('.actions button[data-primary]:not(:disabled)')].pop();
    if (b) tapButton(b);
    return;
  }
  retireButtons();
  addRow('user', esc(text));
  input.value = '';
  route(text);
}

async function route(raw){
  const t = norm(raw);

  switch (state) {

    /* ----- Collecting transfer details ----- */
    case 'ask_amount':
      absorb(raw, 'amount');
      if (!tx.amount) return bot(["Sorry, I didn't catch the amount — could you type it as a number, e.g. HKD 500,000?"]);
      return nextSlot('Got it.');

    case 'ask_dest':
      absorb(raw, 'dest');
      if (!tx.bank || !tx.account) return bot([!tx.account
        ? "Could you share the beneficiary's account number as well?"
        : "And which bank is that account with?"]);
      return nextSlot('Thanks!');

    case 'ask_name': {
      const name = extractName(raw);
      if (name.length < 2 || /^\d+$/.test(name)) return bot(["Could you share the beneficiary's full name as it appears on their account?"]);
      tx.name = name;
      return offerTD();
    }

    /* ----- Time deposit offer ----- */
    case 'offer':
      if (wantsTransfer(t) || isNeg(t)) return reviewTransfer("No problem at all!");
      if (wantsMore(t)) return explainTD();
      return bot([`Would you like to hear more about the 3% time deposit, or shall we go ahead with the transfer to ${esc(tx.bank)}?`]);

    case 'td_explain':
      if (wantsTransfer(t) || (isNeg(t) && !/set/.test(t))) return reviewTransfer("Sure thing!");
      if (wantsSetup(t)) return setupTD();
      if (/(early|withdraw|break|before|penalt|risk|safe|protect|minimum|min|renew|rollover)/.test(t)) {
        return bot([
          "Good question! The funds stay locked in until maturity, and withdrawing early may mean you lose some or all of the interest. At maturity you'll get the principal plus interest back in your account.",
          `Would you like to set it up, or go ahead with the transfer to ${esc(tx.bank)} instead?` +
            buttons([{id:'td_setup', label:'Set up my Time Deposit'},{id:'tx_go', label:`Transfer to ${tx.bank}`, ghost:true}])
        ]);
      }
      return bot([`Just let me know — shall I set up the time deposit, or go ahead with the transfer to ${esc(tx.bank)}?`]);

    /* ----- Transfer review ----- */
    case 'tx_review':
      if (isNeg(t) || /cancel/.test(t)) return action('tx_cancel');
      if (isPos(t) || /(confirm|submit|send)/.test(t)) return action('tx_confirm');
      return bot(["Shall I go ahead and submit this transfer? A simple yes or no works!"]);

    /* ----- End of journey ----- */
    case 'anything_else':
      if (isNeg(t) || (isThanks(t) && !isTransferIntent(t))) {
        state = 'ended';
        return bot(["Thanks for chatting with me today. Have a fantastic day — bye for now!"]);
      }
      if (isPos(t) && !isTransferIntent(t) && !isTDIntent(t)) {
        state = 'menu';
        return bot(["Awesome! What can I help you with?"]);
      }
      state = 'menu';
      return route(raw);

    case 'ended':
      state = 'menu';
      return route(raw);

    /* ----- Menu / intent detection ----- */
    case 'menu':
    default:
      if (isTransferIntent(t)) {
        const keepDest = tdDone && !/\d/.test(raw);   // e.g. "now do the transfer as well"
        if (!keepDest) tx = {amount:null, bank:null, account:null, name:null};
        absorb(raw, 'amount');
        return startTransfer(keepDest);
      }
      if (isTDIntent(t)) {
        tx = {amount:null, bank:null, account:null, name:null};
        return bot(["We're currently offering 3% p.a. on a 2-month HKD time deposit. To get started, just tell me how much (in HKD) you'd like to transfer or place, and I'll take it from there."]);
      }
      if (isGreeting(t)) return bot(["Hello hello! What can I do for you today?"]);
      if (isNeg(t)) { state = 'anything_else'; return route(raw); }
      return bot(["Hmm, I'm not quite sure I caught that. Could you tell me a bit more? For example, I can help you make a transfer."]);
  }
}

async function startTransfer(keepDest){
  if (keepDest && tx.amount && tx.account && tx.name) return reviewTransfer("Of course!");
  tdDone = false;
  return nextSlot("Hello! I'd be happy to help you with that transfer.");
}

async function offerTD(){
  state = 'offer';
  await bot([
    `Thank you! Before we proceed, I'd also like to mention that we're currently offering a time deposit rate of <b>3%</b> for a <b>2-month</b> tenor — that's a really good rate at the moment, and it could be a great way to earn some interest on your funds. Would you like to hear more, or shall we go ahead with the transfer to ${esc(tx.bank)}?`
  ]);
}

const tdInterest = () => tx.amount * TD_RATE * TD_TENOR_MONTHS / 12;
function maturityDate(){
  const d = new Date(chatStart);
  const day = d.getDate();
  d.setMonth(d.getMonth() + TD_TENOR_MONTHS);
  if (d.getDate() !== day) d.setDate(0);   // clamp e.g. 31 Dec + 2m → 28/29 Feb
  return d;
}

async function explainTD(){
  state = 'td_explain';
  await bot([
    `Of course! With our time deposit, you'd earn a fixed rate of 3% over a 2-month tenor. That means on ${fmt(tx.amount)}, you'd earn approximately <b>${fmt(tdInterest())}</b> in interest at maturity. The funds would be locked in for the 2-month period, and you'd receive the principal plus interest at the end.`,
    "If you'd like to set this up, just tap the button below and we'll get it done in one click:" +
      buttons([{id:'td_setup', label:'Set up my Time Deposit'}]),
    `Otherwise, would you prefer to go ahead with transferring the ${fmt(tx.amount)} to ${esc(tx.bank)}?`
  ]);
}

async function setupTD(){
  setBusy(true);
  const ref = 'TD-' + new Date().getFullYear() + '-' + Math.floor(100000 + Math.random()*900000);
  const mat = fmtDate(maturityDate());
  await say("Setting up your time deposit…", {wait: 900});
  await say(`<div class="card"><div class="t">Time deposit placed</div><dl><dt>Reference</dt><dd>${ref}</dd><dt>Principal</dt><dd>${fmt(tx.amount)}</dd><dt>Rate</dt><dd>3.00% p.a.</dd><dt>Tenor</dt><dd>2 months</dd><dt>Maturity</dt><dd>${mat}</dd><dt>Est. interest</dt><dd>${fmt(tdInterest())}</dd></dl></div>`, {plainLen: 60});
  tdDone = true;
  setBusy(false);
  state = 'anything_else';
  await bot([`Great choice! I've set up your time deposit: ${fmt(tx.amount)} at 3% for a 2-month tenor, maturing on <b>${mat}</b> with approximately ${fmt(tdInterest())} in interest. You'll receive the principal plus interest at maturity. Is there anything else I can help you with today?`]);
}

async function reviewTransfer(lead){
  state = 'tx_review';
  await bot([
    `${lead} Here's a summary of your transfer — please check the details:` +
    `<div class="card" style="margin-top:8px"><div class="t">Review transfer</div><dl><dt>Amount</dt><dd>${fmt(tx.amount)}</dd><dt>To</dt><dd>${esc(tx.name)}</dd><dt>Bank</dt><dd>${esc(tx.bank)}</dd><dt>Account</dt><dd>${esc(tx.account)}</dd></dl></div>` +
    buttons([{id:'tx_confirm', label:'Confirm transfer'},{id:'tx_cancel', label:'Cancel', ghost:true}])
  ]);
}

/* ---------- Button actions ---------- */
async function action(id){
  switch (id) {
    case 'td_setup':  return setupTD();
    case 'tx_go':     return reviewTransfer("Sure thing!");
    case 'tx_cancel': return askAnythingElse("No problem — I've cancelled that transfer.");
    case 'tx_confirm': {
      state = 'anything_else';
      setBusy(true);
      const ref = 'TT-' + new Date().getFullYear() + '-' + Math.floor(100000 + Math.random()*900000);
      await say("Submitting your transfer…", {wait: 900});
      await say(`<div class="card"><div class="t">Transfer submitted</div><dl><dt>Reference</dt><dd>${ref}</dd><dt>Amount</dt><dd>${fmt(tx.amount)}</dd><dt>To</dt><dd>${esc(tx.name)}</dd><dt>Bank / A/C</dt><dd>${esc(tx.bank)} · ${esc(tx.account)}</dd><dt>Status</dt><dd>Processing</dd></dl></div>`, {plainLen: 60});
      setBusy(false);
      return askAnythingElse(`All done! Your ${fmt(tx.amount)} transfer to ${esc(tx.name)} is on its way.`);
    }
  }
}

/* ---------- Wiring ---------- */
sendBtn.onclick = () => handleUser(input.value);
input.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.isComposing) handleUser(input.value); });
welcome();
</script>
</body>
</html>
